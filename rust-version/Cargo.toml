[package]
name = "simple-boot-douban-api-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking", "cookies"] } # blocking optional, checking if needed. Actually async is better.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.22" # For HTML parsing
moka = { version = "0.12", features = ["future"] } # Async cache
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
anyhow = "1.0"
dotenvy = "0.15"
once_cell = "1.19"
futures = "0.3" # For join_all
url = "2.5"
bytes = "1.5"
