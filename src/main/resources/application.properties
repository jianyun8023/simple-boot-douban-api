quarkus.http.port=8085
quarkus.arc.auto-inject-beans=true
douban.api.mappings.book=1001
douban.api.count=${DOUBAN_CONCURRENCY_SIZE:5}
douban.api.base-url=https://book.douban.com/
douban.api.search-url=https://www.douban.com/search?cat={searchType}&q={searchText}
douban.api.detail-url=https://book.douban.com/subject/{id}/
douban.api.isbn-url=https://book.douban.com/isbn/{isbn}/
douban.api.proxy-image-url=${DOUBAN_PROXY_IMAGE_URL:true}

# Cache config
quarkus.cache.caffeine.dobanBook.maximum-size=${DOUBAN_BOOK_CACHE_SIZE:1000}
quarkus.cache.caffeine.dobanBook.expire-after-write=${DOUBAN_BOOK_CACHE_EXPIRE:24h}
# Weak values are not directly supported by properties in standard Quarkus cache, but basic eviction is.

quarkus.cache.caffeine.doubanImage.maximum-size=${DOUBAN_BOOK_CACHE_SIZE:1000}
quarkus.cache.caffeine.doubanImage.expire-after-write=${DOUBAN_BOOK_CACHE_EXPIRE:24h}
